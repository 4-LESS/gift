:root {
  --bg: #000000;
  --fg: #ffffff;
  --mid: rgba(255, 255, 255, 0.48);
  --dim: rgba(255, 255, 255, 0.16);
  --ac: #ff7722;
  --font: 'Silkscreen', monospace;
  --snap: cubic-bezier(0.16, 1, 0.3, 1);
  --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  color: var(--fg);
  font-family: var(--font);
  -webkit-font-smoothing: none;
  -webkit-user-select: none;
  user-select: none;
}

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 4vh 6vw;
  transition: transform 0.35s var(--snap);
}
.stage.mirror { transform: scaleX(-1); }

/* CONTENEDOR DE VISTAS CON TRANSICIÓN SNAPPY */
.view-wrap {
  position: relative;
  width: min(92vw, 760px);
  display: grid;
  place-items: center;
}

.sec {
  grid-area: 1 / 1;
  width: 100%;
  opacity: 0;
  transform: scale(0.92) translateY(12px);
  pointer-events: none;
  transition: opacity 0.28s var(--snap), transform 0.32s var(--snap);
}
.sec.on {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

/* =========================================================================
   1. VISTA RELOJ (MODO REPOSO LIMPIO + MENSAJE DEL DÍA OPCIONAL + OFFLINE QR)
   ========================================================================= */
.sb-layout {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  transition: gap 0.35s var(--snap);
}
.sb-layout.is-offline {
  gap: clamp(24px, 5vw, 56px);
}

.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: transform 0.35s var(--snap);
}

.clock-row {
  font-size: clamp(54px, 11vw, 96px);
  line-height: 1;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  color: var(--fg);
}

.colon {
  color: var(--ac);
  margin: 0 0.06em;
  animation: blinkColon 1s steps(2, jump-none) infinite;
}
@keyframes blinkColon {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.14; }
}

.digit-pop {
  display: inline-block;
  animation: digitBounce 0.26s var(--pop);
}
@keyframes digitBounce {
  0% { transform: translateY(8px) scale(0.94); opacity: 0.5; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.date-txt {
  margin-top: 14px;
  font-size: clamp(12px, 1.8vw, 16px);
  letter-spacing: 0.26em;
  color: var(--mid);
  text-transform: uppercase;
}

/* MENSAJE DEL DÍA (OCULTO POR DEFECTO SI NO HAY MENSAJE DE HOY) */
.daily-msg {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  margin-top: 0;
  padding-top: 0;
  border-top: 1px dashed transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  max-width: 480px;
  transform: translateY(8px);
  transition: all 0.38s var(--snap);
}
.daily-msg.show {
  max-height: 90px;
  opacity: 1;
  margin-top: 28px;
  padding-top: 18px;
  border-top-color: var(--dim);
  transform: translateY(0);
}
.daily-msg .heart {
  color: var(--ac);
  font-size: clamp(13px, 1.8vw, 17px);
  display: inline-block;
  animation: heartPulse 1.6s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes heartPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.22); }
}
.daily-msg .msg-text {
  font-size: clamp(11px, 1.5vw, 14px);
  letter-spacing: 0.12em;
  line-height: 1.5;
  color: var(--fg);
  text-transform: uppercase;
}

/* PANEL QR OFFLINE (SOLO SE DESPLIEGA CUANDO NO HAY INTERNET) */
.offline-side {
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 32px);
  max-width: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateX(16px) scale(0.95);
  transition: all 0.38s var(--snap);
}
.sb-layout.is-offline .offline-side {
  max-width: 420px;
  opacity: 1;
  transform: translateX(0) scale(1);
}
.v-divider {
  width: 1px;
  height: 150px;
  border-left: 1px dashed var(--dim);
  flex-shrink: 0;
}
.qr-card {
  display: flex;
  align-items: center;
  gap: 18px;
}
.qr-frame {
  width: clamp(96px, 14vw, 124px);
  height: clamp(96px, 14vw, 124px);
  background: #ffffff;
  padding: 7px;
  border: 2px solid var(--ac);
  flex-shrink: 0;
}
.qr-frame svg {
  width: 100%;
  height: 100%;
  display: block;
}
.qr-meta {
  display: flex;
  flex-direction: column;
  gap: 7px;
  text-align: left;
  min-width: 165px;
}
.qr-title {
  font-size: clamp(11px, 1.5vw, 14px);
  color: var(--ac);
  letter-spacing: 0.14em;
}
.qr-sub {
  font-size: clamp(10px, 1.25vw, 12px);
  color: var(--fg);
  line-height: 1.45;
  letter-spacing: 0.08em;
}
.qr-ver {
  font-size: clamp(9px, 1.1vw, 11px);
  color: var(--mid);
  letter-spacing: 0.1em;
  margin-top: 4px;
}

/* =========================================================================
   2. VISTA REPRODUCTOR HORIZONTAL (ÁLBUM FLOTANDO | LYRICS + AVANCE + CONTROLES)
   ========================================================================= */
.pl-grid {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: clamp(24px, 5vw, 48px);
  width: 100%;
}

/* Columna Izquierda: Foto del Álbum Redondeada Flotando + Título/Artista */
.pl-left {
  width: clamp(150px, 26vw, 210px);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.album-float-wrap {
  width: clamp(130px, 22vw, 176px);
  height: clamp(130px, 22vw, 176px);
  border-radius: 18px;
  overflow: hidden;
  border: 1.5px solid rgba(255, 255, 255, 0.28);
  background: #0d0d0d;
  position: relative;
  margin-bottom: 16px;
  box-shadow: 0 12px 30px rgba(255, 119, 34, 0.14);
  animation: albumFloat 4.2s ease-in-out infinite;
  transition: transform 0.28s var(--pop), border-color 0.25s ease;
}
.pl.paused .album-float-wrap {
  animation-play-state: paused;
  border-color: rgba(255, 255, 255, 0.15);
}
.album-float-wrap.track-pop {
  animation: trackSwapPop 0.34s var(--pop);
}
@keyframes albumFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}
@keyframes trackSwapPop {
  0% { transform: scale(0.84) translateY(8px); opacity: 0.4; }
  100% { transform: scale(1) translateY(0px); opacity: 1; }
}

.album-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.album-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 30% 30%, #261710, #080808);
}

.song-title {
  font-size: clamp(12px, 1.8vw, 16px);
  color: var(--fg);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: transform 0.24s var(--snap), opacity 0.24s ease;
}
.song-artist {
  font-size: clamp(10px, 1.4vw, 13px);
  color: var(--ac);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-top: 6px;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-divider {
  width: 1px;
  height: clamp(160px, 28vw, 220px);
  border-left: 1px dashed var(--dim);
  flex-shrink: 0;
}

/* Columna Derecha: Lyrics + Barra de Avance + Controles */
.pl-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: clamp(175px, 29vw, 225px);
}

/* Visor de Lyrics Sincronizados */
.lyrics-box {
  height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  border-bottom: 1px solid var(--dim);
  padding-bottom: 10px;
  overflow: hidden;
}
.lyr-line {
  font-size: clamp(10px, 1.35vw, 13px);
  color: rgba(255, 255, 255, 0.28);
  letter-spacing: 0.08em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: transform 0.26s var(--snap), opacity 0.26s ease, color 0.26s ease;
}
.lyr-line.curr {
  font-size: clamp(12px, 1.65vw, 15px);
  color: var(--fg);
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.35;
}
.lyr-line.curr .lyr-arrow {
  color: var(--ac);
  margin-right: 6px;
}
.lyr-step {
  animation: lyricSlide 0.24s var(--snap);
}
@keyframes lyricSlide {
  0% { transform: translateY(9px); opacity: 0.35; }
  100% { transform: translateY(0); opacity: 1; }
}

/* Barra de Avance */
.tl-wrap {
  width: 100%;
  margin: 8px 0;
}
.tl-bar {
  height: 2px;
  background: rgba(255, 255, 255, 0.2);
  position: relative;
  margin-bottom: 10px;
  cursor: pointer;
}
.tl-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  background: var(--fg);
  width: 0%;
  transition: width 0.2s linear;
}
.tl-head {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 4px;
  height: 12px;
  background: var(--ac);
  transform: translate(-50%, -50%);
  transition: left 0.2s linear;
}
.tl-times {
  display: flex;
  justify-content: space-between;
  font-size: clamp(10px, 1.3vw, 12px);
  letter-spacing: 0.14em;
  color: var(--mid);
}
.tl-times #tc { color: var(--fg); }

/* Controles de Reproducción con respuesta Snappy */
.ctl {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.ctl button {
  background: none;
  border: 1px solid transparent;
  cursor: pointer;
  color: var(--mid);
  display: grid;
  place-items: center;
  width: clamp(32px, 5vw, 40px);
  height: clamp(32px, 5vw, 38px);
  transition: transform 0.18s var(--pop), color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}
.ctl button:hover { color: var(--fg); }
.ctl button:active, .ctl button.btn-tap {
  transform: scale(0.84);
}
.ctl svg {
  width: 58%;
  height: 58%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: square;
}
.ctl .tog.act {
  color: var(--ac);
  border-color: var(--dim);
}
.ctl .pp {
  width: clamp(44px, 6.5vw, 52px);
  height: clamp(36px, 5.5vw, 42px);
  color: var(--ac);
  border: 1.5px solid var(--ac);
}
.pl.paused .ctl .pp {
  color: var(--fg);
  border-color: var(--fg);
}
.pp .ic-play { display: none; }
.pl.paused .pp .ic-play { display: block; }
.pl.paused .pp .ic-pause { display: none; }

/* OVERLAY DE VOLUMEN FLOTANTE (SOLO APARECE AL MOVER EL ENCODER) */
.vol-toast {
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(-16px) scale(0.92);
  background: #000000;
  border: 1px solid var(--ac);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  letter-spacing: 0.16em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s var(--snap), transform 0.25s var(--pop);
  z-index: 50;
}
.vol-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
}
.vol-bars { color: var(--ac); letter-spacing: 0.08em; }
.vol-bars u { text-decoration: none; color: rgba(255,255,255,0.2); }

/* MENÚ DE SISTEMA CONTROLADO POR ENCODER (PULSACIÓN LARGA) */
.sys-menu-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  display: grid;
  place-items: center;
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.94);
  transition: opacity 0.26s var(--snap), transform 0.28s var(--snap);
}
.sys-menu-backdrop.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}
.sys-menu-box {
  width: min(88vw, 430px);
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  background: #000000;
  padding: 22px 24px;
}
.sys-menu-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px dashed var(--dim);
  padding-bottom: 12px;
  margin-bottom: 14px;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--ac);
}
.sys-menu-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sys-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid transparent;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--mid);
  cursor: pointer;
  transition: all 0.2s var(--snap);
}
.sys-item.active {
  color: var(--fg);
  border-color: rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.07);
  transform: translateX(4px);
}
.sys-item .item-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sys-item .item-arrow {
  color: var(--ac);
  opacity: 0;
}
.sys-item.active .item-arrow {
  opacity: 1;
}
.sys-item .item-val {
  color: var(--ac);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* PANTALLA APAGADA (MODO SLEEP SILENCIOSO) */
.sleep-screen {
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.sleep-screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* REPRODUCTOR YOUTUBE OCULTO */
#yt-wrap {
  position: fixed;
  width: 1px;
  height: 1px;
  bottom: -10px;
  left: -10px;
  opacity: 0.01;
  pointer-events: none;
  overflow: hidden;
}
</style>
</head>

  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

async function checkDailyMessage() {
  try {
    const res = await fetch('./mensaje.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('No msg file');
    const data = await res.json();
    localStorage.setItem('holo_daily_msg_cache', JSON.stringify(data));
    applyDailyMessage(data);
  } catch (e) {
    // Si estamos offline, revisa el último cacheado pero respeta que sea del día de hoy
    const cached = localStorage.getItem('holo_daily_msg_cache');
    if (cached) {
      try { applyDailyMessage(JSON.parse(cached)); } catch(err) { applyDailyMessage(null); }
    } else {
      applyDailyMessage(null);
    }
  }
}

function applyDailyMessage(data) {
  const box = $('dailyMsgBox');
  const txtEl = $('dailyMsgTxt');
  if (!data || !data.texto || !data.texto.trim()) {
    box.classList.remove('show');
    return;
  }
  const today = getTodayIso();
  const isToday = (data.fecha === today) || (data.forzarMostrar === true);
  if (isToday) {
    txtEl.textContent = data.texto.trim();
    box.classList.add('show');
  } else {
    // Fallback: si el mensaje es de días pasados, deja únicamente el reloj limpio
    box.classList.remove('show');
  }
}

function parseLrc(lrcText) {
  const lines = lrcText.split('\n');
  const out = [];
  const rx = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)/;
  for (const line of lines) {
    const m = line.match(rx);
    if (m) {
      const mins = parseInt(m[1], 10);
      const secs = parseInt(m[2], 10);
      const ms   = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) / 1000 : 0;
      const txt  = m[4].trim();
      if (txt) out.push({ time: mins * 60 + secs + ms, text: txt.toUpperCase() });
    }
  }
  return out;
}

      return;
    }

    const best = list.find(item => item.syncedLyrics) || list[0];
    if (best.instrumental) {
      localStorage.setItem(cacheKey, JSON.stringify({ instrumental: true }));
      setLyricLines("", "[ INSTRUMENTAL ]", "");
      return;
    }

    if (best.syncedLyrics) {
      currentLyrics = parseLrc(best.syncedLyrics);
      localStorage.setItem(cacheKey, JSON.stringify({ lines: currentLyrics }));
      updateLyricsByTime(pos);
    } else if (best.plainLyrics) {
      const plain = best.plainLyrics.split('\n').map(s => s.trim().toUpperCase()).filter(Boolean);
      currentLyrics = plain.map((text, idx) => ({ time: idx * 5, text }));
      updateLyricsByTime(pos);
    } else {
      setLyricLines("", `♪ ${title} ♪`, artist);
    }
  } catch (e) {
    setLyricLines("", `♪ ${title} ♪`, artist);
  }
}

function setLyricLines(prevTxt, currTxt, nextTxt, animate = false) {
  $('lyrPrev').textContent = prevTxt || '';
  $('lyrCurrTxt').textContent = currTxt || '';
  $('lyrNext').textContent = nextTxt || '';
  if (animate) {
    const c = $('lyrCurr');
    c.classList.remove('lyr-step');
    void c.offsetWidth;
    c.classList.add('lyr-step');
  }
}

function updateLyricsByTime(sec) {
  if (!currentLyrics || currentLyrics.length === 0) return;
  let idx = 0;
  for (let i = 0; i < currentLyrics.length; i++) {
    if (sec >= currentLyrics[i].time) idx = i;
    else break;
  }
  if (idx !== lastLyricIdx) {
    lastLyricIdx = idx;
    const prev = idx > 0 ? currentLyrics[idx - 1].text : '';
    const curr = currentLyrics[idx].text;
    const next = idx + 1 < currentLyrics.length ? currentLyrics[idx + 1].text : '';
    setLyricLines(prev, curr, next, true);
  }
}

let ytPlayer = null;
let ytReady = false;
let ytApiLoaded = false;
let expectedVideoId = null;

function cleanArtistName(rawAuthor) {
  if (!rawAuthor) return "YOUTUBE MUSIC";
  return rawAuthor
    .replace(/\s*-\s*Topic$/i, '')
    .replace(/VEVO$/i, '')
    .replace(/Official$/i, '')
    .trim()
    .toUpperCase();
}

function cleanTrackTitle(rawTitle, artist) {
  if (!rawTitle) return "CARGANDO...";
  let t = rawTitle
    .replace(/\(Official.*?\)/gi, '')
    .replace(/\[Official.*?\]/gi, '')
    .replace(/\(Lyric.*?\)/gi, '')
    .replace(/\(Audio.*?\)/gi, '')
    .replace(/\[HQ\]/gi, '')
    .trim();
  // Si el título viene como "Artista - Canción", separar solo la canción
  if (t.includes(' - ')) {
    const parts = t.split(' - ');
    if (parts[0].toUpperCase().includes(artist)) {
      t = parts.slice(1).join(' - ').trim();
    }
  }
  return t.toUpperCase();
}

function syncDynamicMetadataFromYouTube() {
  if (!ytReady || !ytPlayer || typeof ytPlayer.getVideoData !== 'function') return;
  const vData = ytPlayer.getVideoData();
  if (!vData || !vData.video_id || !vData.title) return;
  if (vData.video_id === lastDynamicVid) return;
  lastDynamicVid = vData.video_id;

  const artist = cleanArtistName(vData.author || DISCS[disc]?.a || "");
  const title  = cleanTrackTitle(vData.title, artist);

  $('ttl').textContent = title;
  $('art2').textContent = artist;

  const wrap = $('albumWrap');
  wrap.classList.remove('track-pop');
  void wrap.offsetWidth;
  wrap.classList.add('track-pop');

  const img = $('albumImg');
  const fb  = $('albumFallback');
  img.style.display = 'block';
  fb.style.display = 'none';
  img.src = `https://i.ytimg.com/vi/${vData.video_id}/hqdefault.jpg`;

  fetchLyricsForTrack(artist, title);
}

function loadYouTubeApi() {
  if (ytApiLoaded) return;
  ytApiLoaded = true;
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '1',
    width: '1',
    // Usamos www.youtube.com para que herede la cookie de tu cuenta YouTube Premium
    host: 'https://www.youtube.com',
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      modestbranding: 1,
      rel: 0,
      playsinline: 1,
      origin: window.location.origin
    },
    events: {
      onReady: () => {
        ytReady = true;
        ytPlayer.setVolume(vol);
        if (disc >= 0 && playing) playCurrentYouTubeTrack();
      },
      onStateChange: (e) => {
        // YT.PlayerState.PLAYING === 1
        if (e.data === 1 && disc >= 0) {
          if (DISCS[disc] && DISCS[disc].listId) {
            syncDynamicMetadataFromYouTube();
          }
        }
        // YT.PlayerState.ENDED === 0
        if (e.data === 0 && disc >= 0) {
          if (DISCS[disc] && DISCS[disc].listId) return; // La playlist avanza sola
          if (rep) {
            ytPlayer.seekTo(0);
            ytPlayer.playVideo();
          } else {
            step(1);
          }
        }
      }
    }
  });
};

function playCurrentYouTubeTrack() {
  if (!isInternetOnline || !ytReady || !ytPlayer || disc < 0) return;
  const dObj = DISCS[disc];
  if (!dObj) return;

  // Si el disco está configurado como Álbum / Playlist / Mix de YouTube Music
  if (dObj.listId) {
    expectedVideoId = null;
    lastDynamicVid = "";
    ytPlayer.loadPlaylist({
      list: dObj.listId,
      listType: 'playlist',
      index: trk,
      startSeconds: 0
    });
    ytPlayer.setVolume(vol);
    if (shuf && typeof ytPlayer.setShuffle === 'function') ytPlayer.setShuffle(true);
    if (rep && typeof ytPlayer.setLoop === 'function') ytPlayer.setLoop(true);
    return;
  }

  const trackData = dObj.t[trk];
  const vid = trackData[2];
  if (!vid) return;
  expectedVideoId = vid;
  lastDynamicVid = vid;
  ytPlayer.loadVideoById({ videoId: vid, startSeconds: 0 });
  ytPlayer.setVolume(vol);
}

setInterval(() => {
  if (disc < 0 || !playing) return;

  if (isInternetOnline && ytReady && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
    try {
      const vData = ytPlayer.getVideoData ? ytPlayer.getVideoData() : null;
      if (DISCS[disc] && DISCS[disc].listId) {
        syncDynamicMetadataFromYouTube();
      } else if (vData && vData.video_id && expectedVideoId && vData.video_id !== expectedVideoId) {
        // Fallback anti-anuncios por si en algún momento no hay sesión Premium activa
        const adDur = ytPlayer.getDuration();
        if (adDur > 0) ytPlayer.seekTo(adDur, true);
        ytPlayer.loadVideoById(expectedVideoId);
        return;
      }
      const cur = ytPlayer.getCurrentTime();
      if (cur > 0) pos = cur;
    } catch (err) {}
  } else {
    pos += 0.25;
    if (pos >= dur()) {
      pos = 0;
      if (!rep) step(1);
    }
  }
  paintTime();
  updateLyricsByTime(pos);
}, 250);

const dur = () => {
  if (isInternetOnline && ytReady && ytPlayer && typeof ytPlayer.getDuration === 'function') {
    const d = ytPlayer.getDuration();
    if (d && d > 0) return d;
  }
  return (disc >= 0 && DISCS[disc]) ? DISCS[disc].t[trk][1] : 180;
};

function load(i) {
  if (i < 0 || i >= DISCS.length) return;
  disc = i; trk = 0; pos = 0;
  paintMeta();
  $('sb').classList.remove('on');
  $('pl').classList.add('on');

  playCurrentYouTubeTrack();
}

function eject() {
  if (disc < 0) return;
  setPlay(false);
  if (ytReady && ytPlayer && typeof ytPlayer.stopVideo === 'function') {
    ytPlayer.stopVideo();
  }
  disc = -1; pos = 0;
  $('pl').classList.remove('on');
  $('sb').classList.add('on');
}

function toggle() {
  pulseButton($('bPP'));
  if (disc >= 0) {
    setPlay(!playing);
  } else {
    load(0);
  }
}

function step(d) {
  if (disc < 0) return;
  pulseButton(d > 0 ? $('bNext') : $('bPrev'));
  const dObj = DISCS[disc];

  // Si es una Playlist o Álbum de YouTube Music, usa el salto nativo de lista
  if (dObj && dObj.listId && ytReady && ytPlayer) {
    pos = 0;
    if (d > 0 && typeof ytPlayer.nextVideo === 'function') ytPlayer.nextVideo();
    else if (d < 0 && typeof ytPlayer.previousVideo === 'function') ytPlayer.previousVideo();
    return;
  }

  const n = dObj.t.length;
  if (shuf && n > 1) trk = (trk + 1 + Math.floor(Math.random() * (n - 1))) % n;
  else trk = (trk + d + n) % n;
  pos = 0;
  paintMeta();
  playCurrentYouTubeTrack();
}

function changeVol(delta) {
  vol = Math.max(0, Math.min(100, vol + delta));
  if (ytReady && ytPlayer && typeof ytPlayer.setVolume === 'function') {
    ytPlayer.setVolume(vol);
  }
  if (window.fully && typeof window.fully.setAudioVolume === 'function') {
    try { window.fully.setAudioVolume(vol, 3); } catch(e) {}
  }
  showVol();
}

function showVol() {
  const on = Math.round(vol / 5);
  let s = '';
  for (let i = 0; i < 20; i++) s += i < on ? '|' : '<u>|</u>';
  $('vbars').innerHTML = s;
  $('vnum').textContent = pad(vol) + '%';
  $('vol').classList.add('show');
  clearTimeout(volT);
  volT = setTimeout(() => $('vol').classList.remove('show'), 1800);
}

function openSysMenu() {

}

function closeSysMenu() {
  isMenuOpen = false;
  $('sysMenu').classList.remove('open');
}

function toggleSysMenu() {
  if (isSleeping) {
    wakeFromSleep();
    return;
  }
  if (isMenuOpen) closeSysMenu();
  else openSysMenu();
}

function navigateSysMenu(dir) {
  const items = getActiveMenuItems();
  if (!items.length) return;
  menuSel = (menuSel + dir + items.length) % items.length;
  renderSysMenu();
}

function triggerMenuSelect() {
  const items = getActiveMenuItems();
  if (items[menuSel] && typeof items[menuSel].run === 'function') {
    items[menuSel].run();
  }
}

function enterSleepMode() {
  closeSysMenu();
  isSleeping = true;
  // Silenciar y pausar cualquier reproducción activa
  if (playing) setPlay(false);
  $('sleepScreen').classList.add('active');
  if (window.fully && typeof window.fully.setScreenBrightness === 'function') {
    try { window.fully.setScreenBrightness(1); } catch(e) {}
  }
}

function wakeFromSleep() {
  if (!isSleeping) return;
  isSleeping = false;
  $('sleepScreen').classList.remove('active');
  applySavedVisualSettings();
}

$('sleepScreen').onclick = () => wakeFromSleep();

let spaceHoldTimer = null;
let spaceHeldTriggered = false;

addEventListener('keydown', e => {
  const k = e.key;
  if (isSleeping) {
    e.preventDefault();
    wakeFromSleep();
    return;
  }

  // Mantener Espacio presionado (igual que el encoder físico) abre el menú
  if (k === ' ' && !e.repeat && !isMenuOpen) {
    spaceHeldTriggered = false;
    spaceHoldTimer = setTimeout(() => {
      spaceHeldTriggered = true;
      toggleSysMenu();
    }, 1000);
  }

  // Tecla 'O' (Opciones), 'H', 'Tab' o 'Enter' abre/cierra el menú directamente
  if (k === 'o' || k === 'O' || k === 'h' || k === 'H' || k === 'Tab' || (!isMenuOpen && k === 'Enter')) {
    e.preventDefault();
    toggleSysMenu();
    return;
  }

  if (isMenuOpen) {
    if (k === 'ArrowUp' || k === 'ArrowLeft') { e.preventDefault(); navigateSysMenu(-1); }
    else if (k === 'ArrowDown' || k === 'ArrowRight') { e.preventDefault(); navigateSysMenu(1); }
    else if ((k === ' ' && !e.repeat) || k === 'Enter') { e.preventDefault(); triggerMenuSelect(); }
    else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); closeSysMenu(); }
    return;
  }

  if (k >= '1' && k <= '5') load(+k - 1);
  else if (k === 'ArrowUp') { e.preventDefault(); changeVol(+5); }
  else if (k === 'ArrowDown') { e.preventDefault(); changeVol(-5); }
  else if (k === 'ArrowRight') step(1);
  else if (k === 'ArrowLeft') step(-1);
  else if (k === '0' || k === 'Escape') eject();
  else if (k === 'm' || k === 'M') {
    mirrorMode = !mirrorMode;
    localStorage.setItem('holo_mirror', mirrorMode ? '1' : '0');
    applySavedVisualSettings();
  } else if (k === 'q' || k === 'Q') {
    forceQrToggle = !forceQrToggle;
    $('sbLayout').classList.toggle('is-offline', !isInternetOnline || forceQrToggle);
  }
});

addEventListener('keyup', e => {
  if (e.key === ' ') {
    clearTimeout(spaceHoldTimer);
    if (!isMenuOpen && !spaceHeldTriggered && !isSleeping) {
      toggle();
    }
    spaceHeldTriggered = false;
  }
});

function parseYouTubeInput(raw) {
  raw = (raw || "").trim();
  if (!raw) return null;
  // Si es URL con list=PL... o list=OLAK5uy_...
  const listMatch = raw.match(/[?&]list=([a-zA-Z0-9_-]+)/);
  if (listMatch) return { type: 'list', id: listMatch[1] };
  // Si empieza con PL, OLAK, RD, UU, FL (IDs directos de playlists/álbumes de YT Music)
  if (/^(PL|OLAK|RD|UU|FL)[a-zA-Z0-9_-]+$/.test(raw)) return { type: 'list', id: raw };
  // Si es URL de video youtu.be/ID o watch?v=ID
  const vidMatch = raw.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (vidMatch) return { type: 'video', id: vidMatch[1] };
  if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return { type: 'video', id: raw };
  return null;
}

function handleCommand(cmd) {
  cmd = cmd.trim();

  // Si la pantalla está en modo Apagar (Sleep), cualquier interacción con el encoder la despierta
  if (isSleeping && (cmd === "ENC:UP" || cmd === "ENC:DOWN" || cmd === "BTN:CLICK" || cmd === "BTN:HOLD" || cmd.startsWith("TAG:"))) {
    wakeFromSleep();
    return;
  }

  if (cmd === "BTN:HOLD") {
    toggleSysMenu();
    return;
  }

  // Si el menú está abierto, el encoder navega y selecciona las opciones
  if (isMenuOpen) {
    if (cmd === "ENC:UP") {
      navigateSysMenu(1);
    } else if (cmd === "ENC:DOWN") {
      navigateSysMenu(-1);
    } else if (cmd === "BTN:CLICK") {
      triggerMenuSelect();
    }
    return;
  }

  if (cmd === "ENC:UP") {
    changeVol(+5);
  } else if (cmd === "ENC:DOWN") {
    changeVol(-5);
  } else if (cmd === "BTN:CLICK") {
    toggle();
  } else if (cmd.startsWith("TAG:")) {
    const val = cmd.substring(4).trim();
    if (val === "EJECT") {
      eject();
    } else {
      const idx = parseInt(val, 10);
      if (!isNaN(idx) && idx >= 1 && idx <= 5) load(idx - 1);
      else load(0);
    }
  } else if (cmd.startsWith("WIFI_CFG:")) {
    const parts = cmd.substring(9).split('|');
    if (parts.length >= 2) applyWifiInFullyKiosk(parts[0], parts[1], parts[2] || '');
  } else if (cmd.startsWith("ESP_IP:")) {
    const newIp = cmd.substring(7).trim();
    if (newIp) localStorage.setItem('esp32_ip', newIp);
  } else if (cmd === "YT:LOGIN") {
    // Abre el login de Google/YouTube en Fully Kiosk para activar la sesión YouTube Premium
    window.location.href = "https://accounts.google.com/ServiceLogin?service=youtube&continue=https%3A%2F%2Fwww.youtube.com";
  } else if (cmd.startsWith("DISC_CFG:")) {
    // Formato: DISC_CFG:1|NOMBRE ARTISTA O ALBUM|URL_O_ID_YT_MUSIC
    const p = cmd.substring(9).split('|');
    const dIdx = parseInt(p[0], 10) - 1;
    const label = (p[1] || "YOUTUBE MUSIC").trim().toUpperCase();
    const parsed = parseYouTubeInput(p[2] || "");
    if (dIdx >= 0 && dIdx < 5 && parsed) {
      if (parsed.type === 'list') {
        DISCS[dIdx] = { a: label, listId: parsed.id, t: [[label, 240, ""]] };
      } else {
        DISCS[dIdx] = { a: label, t: [[label, 240, parsed.id]] };
      }
      localStorage.setItem('holo_custom_discs', JSON.stringify(DISCS));
      if (disc === dIdx) load(dIdx);
    }
  } else if (cmd.startsWith("MSG_TODAY:")) {
    const txt = cmd.substring(10).trim();
    const msgObj = { fecha: getTodayIso(), texto: txt, forzarMostrar: false };
    localStorage.setItem('holo_daily_msg_cache', JSON.stringify(msgObj));
    applyDailyMessage(msgObj);
  }
}

function initWebSocket() {
  buildHostCandidates();
  const ip = hostCandidates[candidateIdx % hostCandidates.length] || "192.168.4.1";
  const wsUrl = `ws://${ip}:81/`;

  if (ws) {
    try { ws.onclose = null; ws.close(); } catch(e) {}
  }

  try {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      localStorage.setItem('esp32_ip', ip);
      clearTimeout(reconnectTimer);
    };
    ws.onmessage = (event) => {
      const lines = event.data.split('\n');
      for (const line of lines) {
        if (line.trim().length > 0) handleCommand(line);
      }
    };
    ws.onerror = () => {};
    ws.onclose = () => {
      candidateIdx++;
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(initWebSocket, 2200);
    };
  } catch (err) {
    candidateIdx++;
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(initWebSocket, 2500);
  }
}

window.addEventListener('load', () => {
  checkInternetConnection();
  if (navigator.onLine) loadYouTubeApi();
  initWebSocket();
});
</script>
